<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sale Daily Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8fafc;
    transition: opacity 0.3s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #e5e7eb;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 13px; color: #9ca3af; }
  iframe {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: none;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Đang tải Sale Daily Report...</p>
</div>

<iframe
  id="app-frame"
  src="https://script.google.com/macros/s/AKfycby_BkX7HVi83auYwiYad5GK-zienNhBZjvLiNxnNEVC4IDTGdxzFYM7b3o50BltD_Op/exec"
  allow="clipboard-write"
  onload="document.getElementById('loading').classList.add('hide')">
</iframe>

</body>
</html>
